# --- Datasource: NO default password. Supply via environment / secret store. ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/productdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# "update" keeps this lab self-contained. For real production use "validate" + Flyway migrations.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# --- Actuator: only what the platform needs, no details leaked ---
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# --- App settings ---
# Comma-separated list of allowed browser origins. Empty = same-origin only (nginx/ALB proxy /api).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
# Insert two demo products when the table is empty (local/dev only).
app.seed-data=${APP_SEED_DATA:false}

server.error.include-message=never
server.error.include-stacktrace=never
