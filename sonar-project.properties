sonar.projectKey=inventory-management-system
sonar.projectName=Inventory Management System

sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/src
sonar.test.inclusions=**/*Test.java,**/*.test.js
sonar.exclusions=**/node_modules/**,**/target/**,**/build/**,**/*.test.js,frontend/src/index.js,frontend/src/reportWebVitals.js,frontend/src/setupTests.js

sonar.java.binaries=backend/target/classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# make the scanner step fail when the Quality Gate fails
sonar.qualitygate.wait=true
